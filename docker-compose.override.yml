# Dev overrides: hot-reload, expose DB directly, verbose logging
services:
  app:
    build:
      target: development
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir app
    volumes:
      - .:/app
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"

  worker:
    volumes:
      - .:/app
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
